<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodensystem der Elemente – Dashboard</title>
<style>
  :root{
    --bg:#0f1226;
    --panel:#1a1f3d;
    --text:#e8ecf8;
    --muted:#9aa3c4;
    --accent:#5fc3ff;
    --border:#2a3155;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(135deg,#0f1226 0%,#1a1f3d 100%);
    color:var(--text);
    min-height:100vh;
    padding:20px;
  }
  h1{
    text-align:center;
    margin:0 0 8px;
    font-weight:600;
    letter-spacing:.5px;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:24px;
    font-size:14px;
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
    font-size:11px;
  }
  .legend span{
    padding:4px 10px;
    border-radius:12px;
    color:#0f1226;
    font-weight:600;
  }
  .ptable{
    display:grid;
    grid-template-columns:repeat(18, minmax(40px,1fr));
    gap:4px;
    max-width:1400px;
    margin:0 auto;
  }
  .cell{
    aspect-ratio:1/1;
    border-radius:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#0f1226;
    font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease;
    padding:2px;
    user-select:none;
    position:relative;
  }
  .cell:hover{
    transform:scale(1.15);
    z-index:5;
    box-shadow:0 8px 20px rgba(0,0,0,.5);
  }
  .cell .num{font-size:9px;align-self:flex-start;margin-left:4px;opacity:.8}
  .cell .sym{font-size:18px;line-height:1}
  .cell .nm{font-size:8px;margin-top:2px;text-align:center;line-height:1}
  .empty{background:transparent;cursor:default}
  .empty:hover{transform:none;box-shadow:none}

  /* Kategorien */
  .nonmetal{background:#a3e4a1}
  .noblegas{background:#ffd166}
  .alkali{background:#ff9a76}
  .alkaline{background:#ffba6b}
  .transition{background:#9bd1ff}
  .posttransition{background:#c9c9e3}
  .metalloid{background:#dcd06f}
  .halogen{background:#ffe066}
  .lanthanide{background:#f5a8d8}
  .actinide{background:#f08fc4}
  .unknown{background:#bbbbbb}
  .label-row{
    grid-column:1 / -1;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:14px;
    padding-top:8px;
    border-top:1px solid var(--border);
  }

  /* Modal */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:100;
    padding:40px 20px;
    overflow-y:auto;
  }
  .overlay.show{display:flex}
  .modal{
    background:var(--panel);
    border-radius:14px;
    max-width:760px;
    width:100%;
    padding:28px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    border:1px solid var(--border);
    position:relative;
  }
  .close-btn{
    position:absolute;
    top:14px;
    right:14px;
    background:#ff5470;
    color:white;
    border:none;
    width:34px;
    height:34px;
    border-radius:50%;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s;
  }
  .close-btn:hover{background:#ff2f56}
  .modal h2{
    margin:0 0 4px;
    font-size:28px;
    color:var(--accent);
  }
  .modal .symb{
    font-size:14px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .section{
    margin:14px 0;
    padding:12px 14px;
    background:rgba(255,255,255,.03);
    border-left:3px solid var(--accent);
    border-radius:6px;
  }
  .section h3{
    margin:0 0 6px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--accent);
    font-weight:600;
  }
  .section p,.section ul{
    margin:4px 0;
    font-size:14px;
    color:var(--text);
    line-height:1.5;
  }
  .section ul{padding-left:20px}
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .grid3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .stat{
    background:rgba(95,195,255,.08);
    padding:10px;
    border-radius:6px;
    text-align:center;
  }
  .stat .v{font-size:20px;font-weight:700;color:var(--accent)}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:2px}
  @media(max-width:900px){
    .ptable{grid-template-columns:repeat(18,minmax(28px,1fr));gap:2px}
    .cell .nm{display:none}
    .cell .sym{font-size:13px}
    .cell .num{font-size:7px}
    .grid2,.grid3{grid-template-columns:1fr}
  }
  footer.copyright{
    text-align:center;
    margin-top:40px;
    padding:18px 10px;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.5px;
    border-top:1px solid var(--border);
  }
  footer.copyright .sym{
    color:var(--accent);
    font-weight:700;
    margin-right:4px;
  }
</style>
</head>

// =============================================================
//  RENDER PERIODIC TABLE
// =============================================================
const ptable = document.getElementById("ptable");
// Build a map of grid position -> element
const grid = {};
for (const z in elements){
  const el = elements[z];
  const [col,row] = el.pos;
  grid[`${row}-${col}`] = z;
}

// Lanthanides (57-71) on row 9, col 3-17
// Actinides (89-103) on row 10, col 3-17
const lanthanides = [];
for(let z=57; z<=71; z++) lanthanides.push(z);
const actinides = [];
for(let z=89; z<=103; z++) actinides.push(z);

// Render rows 1-7 main table; reposition 57 & 89 as placeholders linking to row 9/10
function buildTable(){
  let html = "";
  for(let row=1; row<=7; row++){
    for(let col=1; col<=18; col++){
      // Special: Lanthanides placeholder at row 6, col 3
      if(row===6 && col===3){
        html += `<div class="cell lanthanide" onclick="showElement(57)">
          <div class="num">57-71</div>
          <div class="sym">La-Lu</div>
          <div class="nm">Lanthanoide</div></div>`;
        continue;
      }
      if(row===7 && col===3){
        html += `<div class="cell actinide" onclick="showElement(89)">
          <div class="num">89-103</div>
          <div class="sym">Ac-Lr</div>
          <div class="nm">Actinoide</div></div>`;
        continue;
      }
      const z = grid[`${row}-${col}`];
      if(z && !(lanthanides.includes(parseInt(z)) && row===6) && !(actinides.includes(parseInt(z)) && row===7)){
        const el = elements[z];
        // skip if 57-71 in row 6 normal pos or 89-103 in row 7 normal pos
        if((parseInt(z)>=57 && parseInt(z)<=71) || (parseInt(z)>=89 && parseInt(z)<=103)){
          html += `<div class="cell empty"></div>`;
        } else {
          html += `<div class="cell ${el.cat}" onclick="showElement(${z})">
            <div class="num">${z}</div>
            <div class="sym">${el.sym}</div>
            <div class="nm">${el.de}</div></div>`;
        }
      } else {
        html += `<div class="cell empty"></div>`;
      }
    }
  }
  // Spacer row
  html += `<div class="label-row">Lanthanoide / Actinoide</div>`;
  // Lanthanide row
  for(let col=1; col<=18; col++){
    if(col<=2){ html += `<div class="cell empty"></div>`; continue; }
    if(col===3){ html += `<div class="cell empty"></div>`; continue; }
    const z = lanthanides[col-4];
    if(z){
      const el = elements[z];
      html += `<div class="cell ${el.cat}" onclick="showElement(${z})">
        <div class="num">${z}</div>
        <div class="sym">${el.sym}</div>
        <div class="nm">${el.de}</div></div>`;
    } else {
      html += `<div class="cell empty"></div>`;
    }
  }
  // Actinide row
  for(let col=1; col<=18; col++){
    if(col<=2){ html += `<div class="cell empty"></div>`; continue; }
    if(col===3){ html += `<div class="cell empty"></div>`; continue; }
    const z = actinides[col-4];
    if(z){
      const el = elements[z];
      html += `<div class="cell ${el.cat}" onclick="showElement(${z})">
        <div class="num">${z}</div>
        <div class="sym">${el.sym}</div>
        <div class="nm">${el.de}</div></div>`;
    } else {
      html += `<div class="cell empty"></div>`;
    }
  }
  ptable.innerHTML = html;
}
buildTable();

// =============================================================
//  MODAL
// =============================================================
function showElement(z){
  const el = elements[z];
  if(!el) return;
  const tempC = (v) => v===null ? "—" : `${v} °C`;
  const tempK = (v) => v===null ? "—" : `${(v+273.15).toFixed(2)} K`;

  const html = `
    <h2>${el.de} <span style="color:var(--muted);font-size:18px">(${el.sym})</span></h2>
    <div class="symb">Ordnungszahl ${el.z} · Atommasse ${el.mass} u · Kategorie: ${categoryName(el.cat)}</div>

    <div class="section">
      <h3>Namen in vier Sprachen</h3>
      <div class="grid2">
        <p><strong>Deutsch:</strong> ${el.de}</p>
        <p><strong>Französisch:</strong> ${el.fr}</p>
        <p><strong>Englisch:</strong> ${el.en}</p>
        <p><strong>Latein:</strong> ${el.la}</p>
      </div>
    </div>

    <div class="section">
      <h3>Atomarer Aufbau</h3>
      <div class="grid3">
        <div class="stat"><div class="v">${el.p}</div><div class="l">Protonen</div></div>
        <div class="stat"><div class="v">${el.n}</div><div class="l">Neutronen</div></div>
        <div class="stat"><div class="v">${el.e}</div><div class="l">Elektronen</div></div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">
        Die Neutronenzahl bezieht sich auf das häufigste / stabilste Isotop.
      </p>
    </div>

    <div class="section">
      <h3>Aggregatzustand & Temperaturen</h3>
      <div class="grid3">
        <div class="stat"><div class="v">${el.state}</div><div class="l">bei 20 °C</div></div>
        <div class="stat"><div class="v">${tempC(el.mp)}</div><div class="l">Schmelzpunkt</div></div>
        <div class="stat"><div class="v">${tempC(el.bp)}</div><div class="l">Siedepunkt</div></div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">
        In Kelvin: Schmelz ${tempK(el.mp)} · Siede ${tempK(el.bp)}
      </p>
    </div>

    <div class="section">
      <h3>Anwendungen in der Technik (Elektrotechnik zuerst)</h3>
      <ul>
        ${el.tech.map(t=>`<li>${t}</li>`).join("")}
      </ul>
    </div>

    <div class="section">
      <h3>Häufige chemische Verbindungen</h3>
      <ul>
        ${el.chem.map(c=>`<li>${c}</li>`).join("")}
      </ul>
    </div>
  `;
  document.getElementById("modal-content").innerHTML = html;
  document.getElementById("overlay").classList.add("show");
}

function closeModal(){
  document.getElementById("overlay").classList.remove("show");
}

document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape") closeModal();
});

function categoryName(c){
  return {
    nonmetal:"Nichtmetall",
    noblegas:"Edelgas",
    alkali:"Alkalimetall",
    alkaline:"Erdalkalimetall",
    transition:"Übergangsmetall",
    posttransition:"Hauptgruppenmetall",
    metalloid:"Halbmetall",
    halogen:"Halogen",
    lanthanide:"Lanthanoid",
    actinide:"Actinoid",
    unknown:"unbekannt"
  }[c] || c;
}
